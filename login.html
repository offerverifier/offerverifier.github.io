<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In - Offer Letter Verifier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.15);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #7dd3fc;
      --accent-strong: #22d3ee;
      --success: #22c55e;
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Manrope", "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, rgba(34,211,238,0.15), transparent 40%),
                  radial-gradient(circle at 80% 80%, rgba(125,211,252,0.18), transparent 40%),
                  var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .card-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .card-header h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .card-header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(125,211,252,0.1);
    }

    .form-group input::placeholder {
      color: var(--muted);
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #0f172a;
      box-shadow: 0 8px 24px rgba(34,211,238,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(34,211,238,0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider span {
      padding: 0 12px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .alert.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-error {
      background: rgba(248,113,113,0.15);
      border: 1px solid rgba(248,113,113,0.3);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.3);
      color: #bbf7d0;
    }

    .toggle-mode {
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .toggle-mode button {
      background: none;
      border: none;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.9rem;
    }

    .toggle-mode button:hover {
      color: var(--accent-strong);
    }

    .password-requirements {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
      display: none;
    }

    .password-requirements.show {
      display: block;
    }

    /* Google Sign-In button styling */
    #g_id_onload {
      display: none;
    }

    .g_id_signin {
      width: 100% !important;
    }

    .g_id_signin > div {
      margin: 0 auto;
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
      }

      .logo h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>🔐 Offer Verifier</h1>
      <p>Verify job offers with confidence</p>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 id="cardTitle">Sign In</h2>
        <p id="cardSubtitle">Welcome back! Please sign in to continue</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="authForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
          />
          <div id="passwordReqs" class="password-requirements">
            Password must be at least 8 characters
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span id="btnText">Sign In</span>
        </button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <!-- Google Sign-In Button Container -->
      <div id="g_id_onload"
           data-client_id="254432789690-17pdvgorjunpprd2v6985o682d053ssl.apps.googleusercontent.com"
           data-callback="handleGoogleSignIn"
           data-auto_prompt="false">
      </div>
      
      <div class="g_id_signin" 
           data-type="standard"
           data-size="large"
           data-theme="outline"
           data-text="continue_with"
           data-shape="rectangular"
           data-logo_alignment="left"
           data-width="100%">
      </div>

      <div class="toggle-mode">
        <span id="toggleText">Don't have an account?</span>
        <button type="button" id="toggleBtn">Sign Up</button>
      </div>
    </div>
  </div>

  <script>
    // API Configuration - automatically detects environment
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? '' // Local development - same origin
      : 'https://offer-letter-verifier.onrender.com'; // Production backend
    
    // Google OAuth Client ID - works for both Flask templates and static sites
    const GOOGLE_CLIENT_ID = '{{ google_client_id }}' || '254432789690-17pdvgorjunpprd2v6985o682d053ssl.apps.googleusercontent.com';
    
    console.log('API Base URL:', API_BASE);
    console.log('Google Client ID:', GOOGLE_CLIENT_ID);
    
    // Auth token management
    const AUTH_TOKEN_KEY = 'auth_token';
    
    function getAuthToken() {
      return localStorage.getItem(AUTH_TOKEN_KEY);
    }
    
    function setAuthToken(token) {
      localStorage.setItem(AUTH_TOKEN_KEY, token);
    }
    
    function clearAuthToken() {
      localStorage.removeItem(AUTH_TOKEN_KEY);
    }
    
    // Elements
    const authForm = document.getElementById('authForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const toggleBtn = document.getElementById('toggleBtn');
    const cardTitle = document.getElementById('cardTitle');
    const cardSubtitle = document.getElementById('cardSubtitle');
    const toggleText = document.getElementById('toggleText');
    const alertBox = document.getElementById('alertBox');
    const passwordReqs = document.getElementById('passwordReqs');

    let isSignUpMode = false;

    // Toggle between Sign In and Sign Up
    toggleBtn.addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      
      if (isSignUpMode) {
        cardTitle.textContent = 'Create Account';
        cardSubtitle.textContent = 'Sign up to start verifying offers';
        btnText.textContent = 'Sign Up';
        toggleText.textContent = 'Already have an account?';
        toggleBtn.textContent = 'Sign In';
        passwordReqs.classList.add('show');
        passwordInput.setAttribute('autocomplete', 'new-password');
      } else {
        cardTitle.textContent = 'Sign In';
        cardSubtitle.textContent = 'Welcome back! Please sign in to continue';
        btnText.textContent = 'Sign In';
        toggleText.textContent = "Don't have an account?";
        toggleBtn.textContent = 'Sign Up';
        passwordReqs.classList.remove('show');
        passwordInput.setAttribute('autocomplete', 'current-password');
      }
      
      hideAlert();
    });

    // Show alert
    function showAlert(message, isError = false) {
      alertBox.textContent = message;
      alertBox.className = `alert ${isError ? 'alert-error' : 'alert-success'} show`;
    }

    // Hide alert
    function hideAlert() {
      alertBox.classList.remove('show');
    }

    // Handle form submission
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      // Validation
      if (!email || !password) {
        showAlert('Please fill in all fields', true);
        return;
      }

      if (isSignUpMode && password.length < 8) {
        showAlert('Password must be at least 8 characters', true);
        return;
      }

      // Disable button
      submitBtn.disabled = true;
      btnText.textContent = isSignUpMode ? 'Creating account...' : 'Signing in...';

      try {
        const endpoint = isSignUpMode ? '/api/auth/register' : '/api/auth/login';
        const response = await fetch(`${API_BASE}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showAlert(data.error || 'Authentication failed', true);
          return;
        }

        // Store the token from backend response
        if (data.token) {
          setAuthToken(data.token);
          console.log('Token saved to localStorage:', data.token.substring(0, 20) + '...');
        } else {
          console.warn('No token in response, using email as fallback');
          setAuthToken(email); // Fallback if backend doesn't return token
        }

        // Success
        showAlert(isSignUpMode ? 'Account created successfully!' : 'Signed in successfully!', false);
        
        // Redirect to home page after ensuring token is saved
        setTimeout(() => {
          console.log('Redirecting to index.html...');
          window.location.href = '/index.html';
        }, 1500);

      } catch (error) {
        showAlert('Network error. Please try again.', true);
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = isSignUpMode ? 'Sign Up' : 'Sign In';
      }
    });

    // Google Sign In callback
    window.handleGoogleSignIn = async (response) => {
      console.log('Google Sign-In response received');
      hideAlert();
      
      try {
        const credential = response.credential;
        
        // Send credential to backend
        const res = await fetch(`${API_BASE}/api/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential })
        });

        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error || 'Google Sign-In failed', true);
          return;
        }

        // Store the token from backend response
        if (data.token) {
          setAuthToken(data.token);
          console.log('Google token saved to localStorage:', data.token.substring(0, 20) + '...');
        } else {
          console.warn('No token in Google response');
        }

        // Success
        showAlert('Signed in with Google successfully!', false);
        
        // Redirect to home page after ensuring token is saved
        setTimeout(() => {
          console.log('Redirecting to index.html...');
          window.location.href = '/index.html';
        }, 1500);

      } catch (error) {
        console.error('Google Sign-In error:', error);
        showAlert('Google Sign-In failed. Please try again.', true);
      }
    };

    // Check if already authenticated
    (async () => {
      try {
        const token = getAuthToken();
        if (!token) {
          console.log('No token found, staying on login page');
          return;
        }
        
        const response = await fetch(`${API_BASE}/api/auth/me`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        
        if (response.ok) {
          const data = await response.json();
          if (data.success && data.user) {
            // Already logged in, redirect to home
            console.log('Already authenticated, redirecting to index');
            window.location.href = '/index.html';
          }
        } else {
          // Token invalid, clear it
          console.log('Token invalid, clearing');
          clearAuthToken();
        }
      } catch (error) {
        // Not authenticated, stay on login page
        console.log('Not authenticated, staying on login page');
      }
    })();
  </script>
</body>
</html>
